name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AgySwitcher.exe
        shell: powershell
        run: .\build.ps1

      - name: Package Portable Zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item AgySwitcher.exe dist\AgySwitcher.exe
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath AgySwitcher_Portable.zip -Force

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AgySwitcher.exe
            AgySwitcher_Portable.zip
