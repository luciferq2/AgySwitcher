name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AgySwitcher.exe
        shell: powershell
        run: |
          $csc = "$env:windir\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "未找到 csc.exe: $csc" }
          & $csc /nologo /target:winexe /optimize+ `
            /win32icon:"$PSScriptRoot\AgySwitcher.ico" `
            /out:"$PSScriptRoot\AgySwitcher.exe" `
            /r:System.Windows.Forms.dll `
            /r:System.Drawing.dll `
            /r:System.Security.dll `
            /r:System.Web.Extensions.dll `
            /r:System.Management.dll `
            "$PSScriptRoot\AgySwitcher.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Portable Zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item AgySwitcher.exe dist\AgySwitcher.exe
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath AgySwitcher_Portable.zip -Force

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AgySwitcher.exe
            AgySwitcher_Portable.zip
